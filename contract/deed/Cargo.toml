[package]
name = "deed"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deed: activation registry and sale escrow for Top Level Account names that run a paid service"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-workspaces = { version = "0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
bs58 = "0.5"

