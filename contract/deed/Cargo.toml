[package]
name = "deed"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deed: activation registry and sale escrow for Top Level Account names that run a paid service"
repository = "https://github.com/codemagician1949/Deed"

[package.metadata.near.reproducible_build]
# Pinned build image (identified by digest): anyone can rebuild the deployed wasm bit for bit with
# `cargo near build reproducible-wasm` and compare its sha256 with the code hash on chain.
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-workspaces = { version = "0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
bs58 = "0.5"

